# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# TV1 điền D1, D2, đánh đổi và các trường YAML. Ba luật dừng còn dấu hỏi: chờ TV3.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
# Cách tính tay: za = NormalDist().inv_cdf(0,975), zb = NormalDist().inv_cdf(0,8)
#   n = (za * sqrt(2*p̄*(1-p̄)) + zb * sqrt(p1*(1-p1)+p2*(1-p2)))^2 / (p2-p1)^2 , làm tròn lên
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48; n = 1.251 * 2,48 = 3.103
#      → 42 người mỗi nhóm, tổng 84 > 40 nhân viên: không đủ người
#   c) 20 nhân viên mỗi nhóm: trần c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức 5 điểm
#   d) 6 depot mỗi nhóm: trần 6 / 0,02 = 300 < 1.251: loại
#   e) Mức chênh 6 điểm: co_mau(0,70; 0,76) = 859 mỗi nhóm.
#      20m / (1 + (m-1)*0,02) >= 859 → 20m >= 859*(0,98 + 0,02m) → 2,82m >= 841,82 → m >= 298,5 → m = 299
#      DE = 1 + 298*0,02 = 6,96. Power nếu tác động thật chỉ là 5 điểm, n = 859:
#      NormalIndPower, effect = proportion_effectsize(0,75; 0,70), ra 0,6417 (hồ sơ ghi 0,64).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia staff 20 + 20 (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm bằng code, seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, MDE 0,06, luật dừng và ngày 2027-01-05 chốt trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   40 nhân viên không đủ mẫu ở MDE 5 điểm (trần 20 người/nhóm chỉ 1.000 < 1.251).
#   Chọn 20 + 20 nhân viên ở MDE 6 điểm (m >= 299 yêu cầu/người, DE 6,96, n hiệu dụng 859).
#   Chấp nhận power 0,6417 (làm tròn 0,64) nếu tác động thật chỉ là 5 điểm.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   TV1 in từ lab13.py: toàn mẫu 4,25% (51/1.200); phạm vi noi_dia + hang_nang 3,97%.
#   Ngưỡng tuyệt đối 3% sẽ dừng nhầm ngay tuần 1. TV3 viết luật an toàn: so với đối chứng (chênh +2 điểm) kèm trần 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"   # một người có tên vai trò, không ghi "cả đội"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×)"
  assignment:
    unit: "staff"                     # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]         # 4 → 10 → 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                         # đánh đổi đã chấp nhận; mức 0,05 không đủ mẫu với 40 nhân viên
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96               # 1 nếu chia theo yêu cầu
    clusters_per_arm: 20              # để trống nếu chia theo yêu cầu
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, phân tầng cùng depot"
    spillover_risk: "Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền theo tài khoản và log lượt mở theo staff_id"
    predeclared: "Có: chỉ số chính, MDE 0,06, luật dừng và ngày quyết định 2027-01-05 viết trước ngày bắt đầu"
  stop_rules:
    # TV3 soạn ít nhất 3 luật (an toàn, chi phí, sử dụng), đúng mẫu NẾU – TRONG – THÌ – KHÔNG THÌ.
    - "NẾU ? TRONG ? THÌ ? KHÔNG THÌ ?"
    - "NẾU ? TRONG ? THÌ ? KHÔNG THÌ ?"
    - "NẾU ? TRONG ? THÌ ? KHÔNG THÌ ?"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated và phut_lam_lai_simulated"
    - "giá giả định: token vào 26 đ và token ra 130 đ mỗi 1.000, tool 15 đ/lần, lương 2.000 đ/phút, baseline tự làm 12.000 đ"
    - "chi phí cố định 40 triệu đ/tháng; ICC 0,02; baseline chỉ số chính 0,70"
    - "mo_lai_trong_7_ngay trên dữ liệu giả lập: 4,25% toàn mẫu, 3,97% trong phạm vi noi_dia + hang_nang"
